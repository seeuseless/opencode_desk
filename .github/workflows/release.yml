# 发版（打 tag 自动出安装包并挂到 Release）
#
# 用法：
#   1. 改 package.json 的 version（如 1.0.1）——**必须先改再打 tag**，两者要对得上：
#      应用内的"当前版本"读的就是安装包里的这个值，对不上会导致它一直提示有新版本。
#   2. git commit && git push
#   3. git tag -a v1.0.1 -m "release v1.0.1" && git push origin v1.0.1
#      → 本工作流自动跑：Windows / macOS 上分别构建安装包，上传到对应 Release 的附件。
#
# 为什么附件名必须固定成「QingNiao-Setup.exe」：
#   应用内"一键下载"用的地址是
#     https://github.com/seeuseless/opencode_desk/releases/latest/download/QingNiao-Setup.exe
#   这条路**不经过 api.github.com**，是国内能直连的下载方式；代价是附件名不能带版本号，
#   每次发版覆盖同名附件。历史版本靠 git tag 与各自的 Release 页面追溯。
#   （名字由 electron-builder.yml 的 artifactName 决定，本工作流只负责上传，不再改名）
#
# ⚠️ 文件名用英文 `QingNiao`、不用中文「青鸟」：GitHub 的附件名与
#   `releases/latest/download/<名>` 直链对非 ASCII 字符要 URL 转义，中文名在下载端
#   表现不稳（转义后地址对不上、部分环境直接拿不到）。**只有产物文件名改英文**，
#   应用本身仍叫「青鸟」（productName 不变），快捷方式与窗口标题不受影响。
#
# 两个平台各自的附件名（都由 electron-builder.yml 决定，改一处即可）：
#   · Windows：QingNiao-Setup.exe（x64，CI 把 ${arch} 产物重命名回固定名以维持
#              releases/latest/download 直链）+ QingNiao-Setup-arm64.exe（ARM64）
#   · macOS  ：QingNiao-Setup-arm64.dmg + QingNiao-Setup-x64.dmg
#              （mac.artifactName 带 ${arch}；--arm64 --x64 双架构出包，覆盖 Apple
#               Silicon 与 Intel）
#   · Linux  ：QingNiao-Setup-x86_64.AppImage + QingNiao-Setup-arm64.AppImage
#              （只出 AppImage、只覆盖 glibc 发行版；Alpine/musl 不支持。
#               注意架构段是 Linux 惯例名 x86_64 不是 x64 —— electron-builder 对
#               AppImage 做了架构名映射，详见 build-linux job 校验步骤上的长注释）
#   双架构出包靠构建命令传 --x64 --arm64（或 --arm64 --x64）两个 flag；交叉架构的
#   内核替换由 beforePack 钩子处理（scripts/electron-before-pack.cjs），对侧内核
#   平台包用 npm pack + tar 备好（平台包有 os/cpu 校验，npm install 会拒装）。
#   updater.ts 的 pickAsset 按 process.arch 认领附件，文件名改了必须两边同步。
#
# ⚠️ 已知踩过的坑（2026-09-22 首次发版，连续失败多次，修完才通）：
#   1) 仓库 .npmrc 与 yarn.lock 里的 780 条 resolved 全部指向腾讯云镜像，
#      海外 runner 拉不动 → install 阶段超时失败。
#      修法见下面「安装依赖」那一步的注释。
#   2) electron-builder.yml 里写了 `extraMetadata: { version: ${version} }`，
#      这个占位符**不会**被展开，被原样写进 app 的 package.json，
#      于是打包到最后一步写 exe 资源版本号时抛
#        ⨯ Invalid major number in: ${version}  failedTask=build
#        at AppInfo.getVersionInWeirdWindowsForm
#      → 构建阶段失败、exe 出不来，前面的 install 全是正常的。
#      修法：删掉该字段，让 electron-builder 自己从 package.json 取 version。
#      教训：extraMetadata 的值不做占位符展开（只有 artifactName 那类模板字段才展开）；
#            排查时**先看构建步骤日志里真正的 ⨯ 那一行**，别被前置步骤的"成功"带偏。
#   3) GH_TOKEN 报错（`GitHub Personal Access Token is not set`）：发生在签名、blockmap 都
#      成功之后，看着像发布失败。真正的来源是——只要 electron-builder.yml 里没显式写
#      publish 配置，它就从 package.json 的 repository 推断出 provider=github，
#      并在写 app-update.yml 时构造 GitHubPublisher → 没 token 直接抛错。
#      ⚠️ `--publish never` **拦不住它**（PublishManager 源码注释：
#         "file should be generated regardless of publish state"）。
#      也**不能**写 `publish: generic`（那样会被强制校验 url，换一个错继续抛：
#         ⨯ Please specify "url" for "generic" update server）。
#      唯一可行解是 `publish: null`（三处 `if (publishers === null) return null` 短路）。
#   4) 上传时列了 `dist/latest.yml` 报
#        ⚠️ Pattern 'dist/latest.yml' does not match any files
#      原因：上面设了 `publish: null` 后 electron-builder **不再生成** latest.yml，
#      而上传步骤带 `fail_on_unmatched_files: true` → 少一个文件就整体失败，
#      把已经构建成功的 exe 一起丢掉。本项目用不到 electron-updater，故不再生成/上传它。
#      教训：`fail_on_unmatched_files: true` 是把双刃剑——它能防"静默跳过"，但要求
#            files 里**只列确定会产出的文件**。新增一行前先确认它真的会被生成。

name: release

on:
  push:
    tags:
      - 'v*'
  # 允许手动跑一次（补传、或某个 tag 的构建失败了要重跑）
  workflow_dispatch:
    inputs:
      tag:
        description: '要补建的 tag（如 v0.0.2）'
        required: true

# 上传附件到 Release 需要写权限（默认 token 只有读权限）
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows：主发版线。这个 job 失败就是发版失败。
  # ---------------------------------------------------------------------------
  build-win:
    runs-on: windows-latest
    # 桌面端整体在 client/ 下（monorepo），所有命令都在该目录执行。
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: client/yarn.lock

      # ⚠️ 源的问题必须显式处理，否则 CI 会在 install 阶段挂：
      #   仓库里的 .npmrc 把 registry 指到 mirrors.cloud.tencent.com（本地开发用，快），
      #   而 **yarn.lock 里 780 条依赖的 resolved 字段全部写死了该镜像地址**。
      #   yarn 1 下载时优先照 resolved 走（--frozen-lockfile 下更是强制），
      #   于是海外 runner 要横跨到腾讯云拉 780 个包，慢且易超时（实测首次失败耗时 3m53s）。
      #
      #   修法：在 runner 上把 lockfile 的镜像地址**临时改写**回官方源再装。
      #   - 只改工作副本、不提交回仓库 → 本地开发照旧走腾讯源，速度不受影响
      #   - 版本号与 integrity 哈希都不动，仅换下载主机，装的还是同一批包
      - name: 安装依赖（腾讯源改写为官方源）
        shell: bash
        run: |
          set -e
          # 1) 仓库自带的 .npmrc 会把 registry 拉回腾讯源，先移除
          rm -f .npmrc

          # 2) lockfile 里所有 resolved 从腾讯镜像改回官方 registry。
          #    改完打印前后数量便于在日志里核对（预期：780 → 0）。
          before=$(grep -c 'mirrors.cloud.tencent.com' yarn.lock || true)
          sed -i 's#https://mirrors\.cloud\.tencent\.com/npm/#https://registry.npmjs.org/#g' yarn.lock
          after=$(grep -c 'mirrors.cloud.tencent.com' yarn.lock || true)
          echo "lockfile 腾讯源数量：改前 $before → 改后 $after（应为 0）"

          # 3) 官方源安装。此时 lockfile 已指向官方源，--frozen-lockfile 既能保证
          #    「装的版本与本地一致」，又不会再去碰腾讯源。
          yarn install --frozen-lockfile --network-timeout 600000

      # ⚠️ 补跑 opencode-ai 的 postinstall（**不能省**，2026-09-22 用户装完启动报
      #   `spawn UNKNOWN` 就是栽在这里）：
      #   opencode-ai 的 bin/opencode.exe **仓库里预置的那个只有 479 字节**，是个
      #   `exit 1` 的斥退占位脚本；真二进制（约 172MB）靠它自己的 postinstall.mjs
      #   从平台包（opencode-windows-x64 / -baseline）硬链接过来覆盖。
      #   而 electron-builder.yml 的 extraResources 正是从 node_modules/opencode-ai/bin 取文件——
      #   一旦 postinstall 没生效，就会把那个占位脚本打进安装包，用户装上必然打不开。
      #   yarn 1 的 postinstall 行为在 CI 上不够可靠（--ignore-scripts / 平台包没装上都会静默跳过），
      #   所以这里显式再跑一次。**失败即中断**（宁可不出包，也不出打不开的包）。
      #   注：跟着的 check-kernel 由 dist 脚本内部再跑一遍（本地打包同样受这个护栏保护），
      #   这里提前跑是为了让失败尽可能早、日志位置更清楚。
      - name: 补跑 opencode-ai postinstall
        shell: bash
        run: node node_modules/opencode-ai/postinstall.mjs

      # 交叉打包 Windows ARM64 的前置：runner 是 x64，opencode-windows-arm64 是
      # optionalDependencies 里 os/cpu 校验拒装的包（npm install 直接 EBADPLATFORM，
      # 见 mac job 里同款步骤的长注释），走 npm pack 下载 tarball 解压到 node_modules。
      # 版本必须与 opencode-ai 声明的一致，从它的 package.json 读。
      # ⚠️ tarball 下到工作区用**相对路径**解压：$RUNNER_TEMP 在 Windows runner 上是
      #   D:\a\_temp 风格，GNU tar 把盘符 "D:" 当远程主机名直接连不上
      #   （"Cannot connect to D: resolve failed"，2026-09-25 v1.5.1 CI 实测）。
      - name: 安装 arm64 内核平台包（Windows ARM64 支持）
        shell: bash
        run: |
          set -e
          VER=$(node -p "require('./node_modules/opencode-ai/package.json').optionalDependencies['opencode-windows-arm64']")
          echo "opencode-windows-arm64@$VER"
          npm pack "opencode-windows-arm64@$VER" --pack-destination .
          mkdir -p node_modules/opencode-windows-arm64
          tar -xzf "opencode-windows-arm64-$VER.tgz" -C node_modules/opencode-windows-arm64 --strip-components 1
          rm "opencode-windows-arm64-$VER.tgz"
          ls -l node_modules/opencode-windows-arm64/bin

      # dist 里已经串了 gen-update-meta → electron-vite build → check-kernel → electron-builder
      # `--publish never` 在这里再显式写一遍（脚本里已带），防将来有人改脚本时把发布打开。
      # --x64 --arm64：一次出双架构包（两个 flag 都要写——只传一个就只出那一个架构）。
      # 产物：QingNiao-Setup-x64.exe + QingNiao-Setup-arm64.exe（artifactName 带 ${arch}）。
      # arm64 包的内核由 beforePack 钩子从 opencode-windows-arm64 换入（上一步备好）。
      - name: 构建 Windows 安装包（x64 + arm64）
        run: yarn dist --x64 --arm64 --publish never
        env:
          # electron 二进制体积大（~100MB），走官方 GitHub Release 直连；
          # 若 CI 上偶发超时，可改为国内镜像（不在仓库里写死，避免影响本地开发）
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache

      # ⚠️ 打包后的产物校验，**不能省**：
      #   1) 两个架构的安装包都必须产出（artifactName 没生效会在上传步骤炸或静默漏传）；
      #   2) 包内内核必须是真二进制且**架构与包一致**——Mach-O/PE 头看不出架构，
      #      这里读 PE 头 machine 字段断言（0x8664=x64、0xaa64=arm64），防止
      #      "交叉轮没换内核"的包混上 Release（2026-09-25 加双架构时立的规矩）。
      #   注：x64 的 unpacked 目录叫 win-unpacked（默认架构无后缀），arm64 叫 win-arm64-unpacked。
      - name: 校验双架构安装包与内核
        shell: bash
        run: |
          for ARCH in x64 arm64; do
            if [ "$ARCH" = x64 ]; then APPDIR="dist/win-unpacked"; else APPDIR="dist/win-$ARCH-unpacked"; fi
            if [ ! -d "$APPDIR" ]; then
              echo "::error::未产出 $APPDIR——检查 electron-builder.yml 的 win 配置与 --x64 --arm64 参数"
              ls -l dist
              exit 1
            fi
            BIN="$APPDIR/resources/bin/opencode.exe"
            if [ ! -f "$BIN" ]; then
              echo "::error::[$ARCH] 安装包内缺少内核二进制：$BIN"
              exit 1
            fi
            SIZE=$(stat -c%s "$BIN")
            echo "[$ARCH] 内核二进制：$BIN（$SIZE 字节，预期 >100MB）"
            if [ "$SIZE" -lt 100000000 ]; then
              echo "::error::[$ARCH] 只有 $SIZE 字节，是未替换的占位脚本而非真二进制"
              exit 1
            fi
            # PE 头 machine 字段：0x8664=x64、0xaa64=arm64，必须与包目录架构一致
            KIND=$(node -p "const fs=require('fs');const b=Buffer.alloc(4096);const f=fs.openSync(process.argv[1],'r');fs.readSync(f,b,0,4096,0);fs.closeSync(f);'0x'+b.readUInt16LE(b.readUInt32LE(0x3c)+4).toString(16)" "$BIN")
            echo "[$ARCH] 内核 PE machine：$KIND"
            case "$ARCH" in
              x64)   if [ "$KIND" != "0x8664" ]; then echo "::error::[$ARCH] 包里的内核不是 x64（$KIND）——beforePack 钩子未生效"; exit 1; fi ;;
              arm64) if [ "$KIND" != "0xaa64" ]; then echo "::error::[$ARCH] 包里的内核不是 arm64（$KIND）——平台包没备好或钩子未生效"; exit 1; fi ;;
            esac
          done
          echo "✓ 双架构安装包与内核均正常"

      # 安装包文件名带 ${arch} 后，x64 产物叫 QingNiao-Setup-x64.exe；而应用内更新与
      # README 承诺的固定直链是 releases/latest/download/QingNiao-Setup.exe（不经
      # api.github.com、国内可直连）。把 x64 包重命名上传，直链不中断（历史版本靠 tag 追溯）。
      - name: 重命名 x64 包为固定名（维持更新直链）
        shell: bash
        run: |
          set -e
          ls -l dist/*.exe
          for f in dist/QingNiao-Setup-x64.exe dist/QingNiao-Setup-arm64.exe; do
            if [ ! -f "$f" ]; then
              echo "::error::未找到 $f——检查 electron-builder.yml 的 win.artifactName 是否带 \${arch}"
              exit 1
            fi
          done
          mv dist/QingNiao-Setup-x64.exe dist/QingNiao-Setup.exe
          echo "✓ x64 包已重命名为 QingNiao-Setup.exe"

      # 上传安装包（files 用固定名：GitHub 会把中文名转义，写死最稳）。
      # ⚠️ files 里**只列确定会产出的文件**（理由见文件头注释第 4 条）：
      #   本项目不用 electron-updater，latest.yml 不会被生成，所以不列。
      #   QingNiao-Setup.exe 是 x64 包重命名后的固定名（维持直链），arm64 带架构后缀，
      #   应用内更新按 process.arch 认领（updater.ts pickAsset）。
      - name: 上传安装包到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            client/dist/QingNiao-Setup.exe
            client/dist/QingNiao-Setup-arm64.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          # 没有手写说明时自动用提交信息生成；有 Release 说明就先建好 Release 再跑本流程
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 构建日志里留一份产物清单：发版后想确认"到底传上去了什么"时不用翻 UI
      - name: 列出产物
        shell: bash
        run: ls -l dist

  # ---------------------------------------------------------------------------
  # macOS：与 Windows 并行构建，产物是各架构的 dmg。
  #
  # ⚠️ `continue-on-error: true` 是刻意的：
  #   个人项目没有 Apple Developer 账号，dmg 出的是**未签名**包（用户首次打开需右键→打开
  #   绕过 Gatekeeper），且 mac 构建历史上更容易受 runner 环境波动影响。
  #   发版的主体是 Windows 包（国内用户为主），不该让 mac 的失败把整个 Release 拦下。
  #   失败时这个 job 会标红但在 GitHub 上不阻塞其他 job；Release 页仍会出 Windows 附件。
  #   想收紧时把这一行删掉即可（那样 mac 构建失败 = 发版失败）。
  # ---------------------------------------------------------------------------
  build-mac:
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: 安装依赖（腾讯源改写为官方源）
        shell: bash
        run: |
          set -e
          rm -f .npmrc
          before=$(grep -c 'mirrors.cloud.tencent.com' yarn.lock || true)
          sed -i '' 's#https://mirrors\.cloud\.tencent\.com/npm/#https://registry.npmjs.org/#g' yarn.lock
          after=$(grep -c 'mirrors.cloud.tencent.com' yarn.lock || true)
          echo "lockfile 腾讯源数量：改前 $before → 改后 $after（应为 0）"
          yarn install --frozen-lockfile --network-timeout 600000

      # mac 上这步同样不能省，理由与 Windows 完全一致（见上面 build-win 里的长注释）。
      # ⚠️ 注意文件名在 mac 上**仍然是 opencode.exe**（无平台差异）：
      #   opencode-ai 的 postinstall.mjs 把目标路径写死成了 bin/opencode.exe，
      #   内容是 Mach-O、靠 chmod 0o755 变可执行，后缀只是个名字。
      #   scripts/check-kernel.mjs 已改为按存在性探测（优先 .exe、回落无后缀），
      #   不再按平台猜文件名——这里若还写"mac 上是 opencode"，会误导后来人。
      - name: 补跑 opencode-ai postinstall
        shell: bash
        run: node node_modules/opencode-ai/postinstall.mjs

      # 交叉打包 Intel mac（x64）的前置：内核平台包是 optionalDependencies，npm/yarn
      # 只装「当前机器架构」的包（Apple Silicon runner 上只有 darwin-arm64），
      # x64 内核必须显式备上，beforePack 钩子（scripts/electron-before-pack.cjs）打
      # x64 包时才有源可拷。版本必须与 opencode-ai 声明的一致，从它的 package.json 读。
      # 选 -baseline（而非 AVX2 版）：发布包要面对所有 Intel mac，老机器不一定支持 AVX2。
      # ⚠️ 不能用 npm install 装：平台包声明了 os/cpu，机器不匹配直接 EBADPLATFORM 拒装
      #   （--force 又会重整依赖树、动到 electron 二进制）。npm pack 只下载 tarball、
      #   不做平台检查也不碰依赖树，解压到 node_modules 即可（electron-builder 按目录找包）。
      #   tarball 下到工作区用**相对路径**解压，与 win job 同款写法——$RUNNER_TEMP 在
      #   Windows runner 上是 D:\a\_temp 风格，GNU tar 会把盘符当远程主机名连不上
      #   （mac 无此坑，但两处写法保持一致，免得将来来回改踩坑）。
      - name: 安装 x64 内核平台包（Intel mac 支持）
        shell: bash
        run: |
          set -e
          VER=$(node -p "require('./node_modules/opencode-ai/package.json').optionalDependencies['opencode-darwin-x64-baseline']")
          echo "opencode-darwin-x64-baseline@$VER"
          npm pack "opencode-darwin-x64-baseline@$VER" --pack-destination .
          mkdir -p node_modules/opencode-darwin-x64-baseline
          tar -xzf "opencode-darwin-x64-baseline-$VER.tgz" -C node_modules/opencode-darwin-x64-baseline --strip-components 1
          rm "opencode-darwin-x64-baseline-$VER.tgz"
          ls -l node_modules/opencode-darwin-x64-baseline/bin

      # dist:mac 里串的是 electron-builder --mac；这里额外关掉签名自动发现，
      # 否则没有钥匙串证书时 electron-builder 会要求签名而失败。
      # --arm64 --x64：一次出双架构包（mac.artifactName 带 ${arch}，互不覆盖）。
      # 产物：QingNiao-Setup-arm64.dmg + QingNiao-Setup-x64.dmg（不再出 zip：它是
      # electron-updater 的 mac 自动更新格式，本项目不用，见 electron-builder.yml）。
      # x64 包的内核由 beforePack 钩子从 opencode-darwin-x64-baseline 换入（上一步装好）。
      - name: 构建 macOS 安装包（未签名，arm64 + x64）
        run: yarn dist:mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache

      # ⚠️ mac 专属断言，**Windows 上测不出来**（Windows 不看可执行位）：
      #   打包进 app 的内核二进制必须带 x 位，否则主进程 spawn 它时会被系统拒绝
      #   （表现同样是启动失败，但报错形式与 spawn UNKNOWN 不同，更难联想）。
      #   源头是后置的 postinstall 会 chmod 0o755；这里验的是**最终产物**，
      #   防止 electron-builder 拷贝 extraResources 时把权限位丢掉。
      #   同时验一下大小，排除"把占位脚本打进去"的老问题（与 Windows 那步等价）。
      # 双架构各验一遍，并用 file 断言**架构没打岔**：这是防止"arm64 机器上打 x64 包
      # 却忘了换内核"的唯一可靠手段——Mach-O 文件头两种架构相同，只有 cputype 能区分
      # （beforePack 钩子若没生效，x64 包里就是 arm64 内核，装上必跑不起来）。
      - name: 校验双架构内核已打进安装包且架构正确
        shell: bash
        run: |
          for ARCH in arm64 x64; do
            # ⚠️ unpacked 目录名规则（getArchSuffix）：默认架构（恒为 x64）不带后缀——
            #   x64 → dist/mac，arm64 → dist/mac-arm64。2026-09-25 v1.5.1 CI 实测踩坑：
            #   写成 dist/mac-x64 找不到目录，arm64 校验通过后整个 job 红掉。
            case "$ARCH" in
              arm64) APPDIR="dist/mac-arm64" ;;
              x64)   APPDIR="dist/mac" ;;
            esac
            BIN="$APPDIR/青鸟.app/Contents/Resources/bin/opencode.exe"
            # 兼容不同 electron-builder 版本的输出目录命名（mac-arm64 / mac / mac-universal）
            if [ ! -f "$BIN" ]; then
              BIN=$(find "$APPDIR" -path '*/Contents/Resources/bin/opencode.exe' -type f 2>/dev/null | head -1)
            fi
            if [ -z "$BIN" ] || [ ! -f "$BIN" ]; then
              echo "::error::[$ARCH] .app 包内找不到内核二进制（Contents/Resources/bin/opencode.exe）"
              echo "::error::检查 electron-builder.yml 的 extraResources 与 asarUnpack 配置"
              exit 1
            fi
            SIZE=$(stat -f%z "$BIN")
            echo "[$ARCH] 内核二进制：$BIN"
            echo "  大小：$SIZE 字节（预期 >100MB）"
            if [ "$SIZE" -lt 100000000 ]; then
              echo "::error::[$ARCH] 只有 $SIZE 字节，是未替换的占位脚本而非真二进制——检查 postinstall 是否生效"
              exit 1
            fi
            # file 输出含 cputype：arm64 架构 → "arm64"，Intel → "x86_64"，必须与包目录一致
            KIND=$(file -b "$BIN")
            echo "  类型：$KIND"
            case "$ARCH" in
              arm64) case "$KIND" in *arm64*) echo "  ✓ 架构匹配" ;; *) echo "::error::[$ARCH] 包里装的不是 arm64 内核（$KIND）"; exit 1 ;; esac ;;
              x64)   case "$KIND" in *x86_64*) echo "  ✓ 架构匹配" ;; *) echo "::error::[$ARCH] 包里装的不是 x64 内核（$KIND）——beforePack 钩子未生效或平台包没装"; exit 1 ;; esac ;;
            esac
            if [ ! -x "$BIN" ]; then
              echo "::error::[$ARCH] 内核二进制没有可执行权限（-x 未通过）——mac 上主进程会无法 spawn 它"
              echo "::error::该文件权限：$(ls -l "$BIN")"
              exit 1
            fi
          done
          echo "✓ 双架构内核均正常且可执行"

      - name: 校验产物
        shell: bash
        run: |
          echo "dist 实际内容："
          ls -l dist
          # dmg 是唯一 mac 产物（应用内更新按 MAC_DMG_NAME 找它）
          for f in dist/*.dmg; do
            if [ -f "$f" ]; then echo "✓ 找到 $f"; else echo "::warning::未产出 $f"; fi
          done
          if ! ls dist/*.dmg >/dev/null 2>&1; then
            echo "::error::未产出任何 dmg——检查 electron-builder.yml 的 mac 配置与 icon.icns 是否存在"
            exit 1
          fi

      # 应用内更新在 mac 上按「当前架构」找 dmg（updater.ts 按 process.arch 拼
      # QingNiao-Setup-${arch}.dmg），这里断言 arm64 / x64 两份产物都在、名字没写岔。
      - name: 校验双架构 dmg 文件名与 updater.ts 命名一致
        shell: bash
        run: |
          grep -n "MAC_DMG_NAME\|process.arch" electron/main/updater.ts
          for ARCH in arm64 x64; do
            if [ ! -f "dist/QingNiao-Setup-$ARCH.dmg" ]; then
              echo "::error::未找到 dist/QingNiao-Setup-$ARCH.dmg"
              echo "::error::主进程 updater.ts 按当前架构期望这个文件名；"
              echo "::error::若实际产物名不同，请同步改 MAC_DMG_NAME 或 mac.artifactName"
              ls -l dist
              exit 1
            fi
            echo "✓ QingNiao-Setup-$ARCH.dmg 存在"
          done

      - name: 上传 macOS 安装包到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            client/dist/QingNiao-Setup-arm64.dmg
            client/dist/QingNiao-Setup-x64.dmg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出产物
        shell: bash
        run: ls -l dist

  # ---------------------------------------------------------------------------
  # Linux：出 AppImage，x64 + arm64 双架构。
  #
  # ⚠️ continue-on-error: true 与 mac 同理由：Linux 是第三平台，不该让它把 Release 拦下。
  #   且 AppImage 构建依赖 runner 上的 appimagetool，失败率比前两条线高。
  #
  # 只覆盖 **glibc** 发行版（Debian / Ubuntu / Fedora / Arch…）：内核平台包选不带 -musl
  # 后缀的那批。Alpine 用户跑不了，README 已注明。
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: 安装依赖（腾讯源改写为官方源）
        shell: bash
        run: |
          set -e
          rm -f .npmrc
          before=$(grep -c 'mirrors.cloud.tencent.com' yarn.lock || true)
          sed -i 's#https://mirrors\.cloud\.tencent\.com/npm/#https://registry.npmjs.org/#g' yarn.lock
          after=$(grep -c 'mirrors.cloud.tencent.com' yarn.lock || true)
          echo "lockfile 腾讯源数量：改前 $before → 改后 $after（应为 0）"
          yarn install --frozen-lockfile --network-timeout 600000

      # 同 win / mac：postinstall 不能省，否则打进去的是 479B 占位脚本（用户装完 spawn 失败）。
      # 文件名在 Linux 上同样是 bin/opencode.exe（上游写死的名字，内容是 ELF），
      # check-kernel.mjs 按存在性探测，不会认错。
      - name: 补跑 opencode-ai postinstall
        shell: bash
        run: node node_modules/opencode-ai/postinstall.mjs

      # 双架构内核平台包：runner 是 x64，arm64 那份 npm 装不上（os/cpu 校验 EBADPLATFORM），
      # 走 npm pack 下载 tarball 再解压——与 mac / win job 同款做法。
      # x64 选 -baseline：发布包要面对所有老机器，baseline 兼容面最大。
      # 只取 glibc 版（包名不带 -musl）。
      - name: 准备 x64/arm64 内核平台包（glibc）
        shell: bash
        run: |
          set -e
          for PKG in opencode-linux-x64-baseline opencode-linux-arm64; do
            VER=$(node -p "require('./node_modules/opencode-ai/package.json').optionalDependencies['$PKG']")
            echo "$PKG@$VER"
            npm pack "$PKG@$VER" --pack-destination .
            mkdir -p "node_modules/$PKG"
            tar -xzf "$PKG-$VER.tgz" -C "node_modules/$PKG" --strip-components 1
            rm "$PKG-$VER.tgz"
            ls -l "node_modules/$PKG/bin"
          done

      # --x64 --arm64：一次出双架构 AppImage。交叉架构的内核由 beforePack 钩子
      # 从上一步备好的平台包换入（PLATFORMS.linux 已配好）。
      - name: 构建 Linux AppImage（x64 + arm64）
        run: yarn dist:linux --x64 --arm64 --publish never
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache

      # ⚠️ 产物校验，不能省。三件事：
      #   1) 两个架构的 AppImage 都要产出（artifactName 没生效会在上传那步炸）；
      #   2) 包内内核是真二进制（>100MB，排除未替换的占位脚本）；
      #   3) 内核架构与包一致 + **有可执行位**——第 3 条在 Linux 上是硬要求：
      #      ELF 头看不出架构，必须靠 file 的输出断言 x86-64 / aarch64；
      #      权限位用 test -x 验，electron-builder 拷 extraResources 时若丢掉 x 位，
      #      主进程 spawn 内核会 EACCES（Windows/mac 上分别由 PE 头与 mac 断言覆盖，
      #      Linux 这条是唯一能抓住它的断言）。
      #
      # ⚠️⚠️ 产物名里的架构段是 **x86_64 / arm64**，不是 x64 / arm64（2026-10-08 CI 实测踩到）：
      #   electron-builder 的 getArtifactArchName（builder-util/out/arch.js）对 AppImage
      #   做了 Linux 惯例映射：x64 → x86_64、ia32 → i386；只有 arm64 / armv7l 保持原名。
      #   （deb 上是 x64 → amd64，exe / dmg 上是 x64 → x64，所以只有 AppImage 这条不一样。）
      #   按 process.arch（"x64"）拼出来的文件名永远匹配不上实际产物——
      #   第一版 CI 就是这么红的：内核校验全过，却报「未找到 dist/QingNiao-Setup-x64.AppImage」。
      #   主进程 updater.ts 的认领正则同步用了这套名字，改一处必须改另一处。
      - name: 校验双架构 AppImage 与内核
        shell: bash
        run: |
          set -e
          for PAIR in "x64:x86_64" "arm64:arm64"; do
            ARCH="${PAIR%%:*}"   # Electron 架构（unpacked 目录名用这个）
            ART="${PAIR##*:}"    # 产物名里的架构段（AppImage 用 Linux 惯例名，见文件头注释）
            if [ "$ARCH" = x64 ]; then APPDIR="dist/linux-unpacked"; else APPDIR="dist/linux-$ARCH-unpacked"; fi
            if [ ! -d "$APPDIR" ]; then
              echo "::error::未产出 $APPDIR——检查 electron-builder.yml 的 linux 配置与 --x64 --arm64 参数"
              ls -l dist
              exit 1
            fi
            BIN="$APPDIR/resources/bin/opencode.exe"
            if [ ! -f "$BIN" ]; then
              echo "::error::[$ARCH] 安装包内缺少内核二进制：$BIN"
              exit 1
            fi
            SIZE=$(stat -c%s "$BIN")
            echo "[$ARCH] 内核：$BIN（$SIZE 字节，预期 >100MB）"
            if [ "$SIZE" -lt 100000000 ]; then
              echo "::error::[$ARCH] 只有 $SIZE 字节，是未替换的占位脚本而非真二进制"
              exit 1
            fi
            # file 输出含 ELF 架构：x86-64 / aarch64，必须与包目录一致
            KIND=$(file -b "$BIN")
            echo "  类型：$KIND"
            case "$ARCH" in
              x64)   case "$KIND" in *x86-64*)  echo "  ✓ 架构匹配" ;; *) echo "::error::[$ARCH] 包里装的不是 x64 内核（$KIND）"; exit 1 ;; esac ;;
              arm64) case "$KIND" in *aarch64*)  echo "  ✓ 架构匹配" ;; *) echo "::error::[$ARCH] 包里装的不是 arm64 内核（$KIND）——beforePack 钩子未生效或平台包没装"; exit 1 ;; esac ;;
            esac
            if [ ! -x "$BIN" ]; then
              echo "::error::[$ARCH] 内核没有可执行权限（-x 未通过）——Linux 上主进程会 EACCES 起不来"
              echo "::error::该文件权限：$(ls -l "$BIN")"
              exit 1
            fi
            if [ ! -f "dist/QingNiao-Setup-$ART.AppImage" ]; then
              echo "::error::未找到 dist/QingNiao-Setup-$ART.AppImage"
              echo "::error::主进程 updater.ts 按 Linux 惯例架构名认领这个文件名；"
              echo "::error::若实际产物名不同，请同步改 LINUX_APPIMAGE_NAME、release.yml 的 ART 映射与 linux.artifactName"
              echo "::error::dist 实际内容："
              ls -l dist
              exit 1
            fi
            echo "✓ QingNiao-Setup-$ART.AppImage 存在"
          done
          echo "✓ 双架构 AppImage 与内核均正常"

      - name: 上传 Linux AppImage 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # 文件名里的架构段是 x86_64 / arm64（AppImage 的 Linux 惯例名，见下面注释），
          # 不是 x64 / arm64 —— 写错这里会因 fail_on_unmatched_files 把整个 job 拖红。
          files: |
            client/dist/QingNiao-Setup-x86_64.AppImage
            client/dist/QingNiao-Setup-arm64.AppImage
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出产物
        shell: bash
        run: ls -l dist
