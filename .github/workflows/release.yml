# 发版（打 tag 自动出安装包并挂到 Release）
#
# 用法：
#   1. 改 package.json 的 version（如 1.0.1）——**必须先改再打 tag**，两者要对得上：
#      应用内的"当前版本"读的就是安装包里的这个值，对不上会导致它一直提示有新版本。
#   2. git commit && git push
#   3. git tag -a v1.0.1 -m "release v1.0.1" && git push origin v1.0.1
#      → 本工作流自动跑：Windows 上构建安装包、上传到对应 Release 的附件。
#
# 为什么附件名必须固定成「青鸟-Setup.exe」：
#   应用内"一键下载"用的地址是
#     https://github.com/seeuseless/opencode_desk/releases/latest/download/青鸟-Setup.exe
#   这条路**不经过 api.github.com**，是国内能直连的下载方式；代价是附件名不能带版本号，
#   每次发版覆盖同名附件。历史版本靠 git tag 与各自的 Release 页面追溯。
#   （名字由 electron-builder.yml 的 artifactName 决定，本工作流只负责上传，不再改名）
#
# 顺带生成 latest.yml 一起传上去：应用侧的检查更新走的是 GitHub Releases API，
# 不需要它；留着是为了将来若改用 electron-updater，元数据已经就位（不影响现在的流程）。
#
# ⚠️ 已知踩过的坑（2026-09-22 首次发版失败）：
#   仓库 .npmrc 与 yarn.lock 里的 780 条 resolved 全部指向腾讯云镜像，
#   海外 runner 拉不动 → install 阶段超时失败（耗时 3m53s，上传步骤被跳过，
#   Release 建出来了但没有任何附件）。修法见下面「安装依赖」那一步的注释。

name: release

on:
  push:
    tags:
      - 'v*'
  # 允许手动跑一次（补传、或某个 tag 的构建失败了要重跑）
  workflow_dispatch:
    inputs:
      tag:
        description: '要补建的 tag（如 v0.0.2）'
        required: true

# 上传附件到 Release 需要写权限（默认 token 只有读权限）
permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # ⚠️ 源的问题必须显式处理，否则 CI 会在 install 阶段挂：
      #   仓库里的 .npmrc 把 registry 指到 mirrors.cloud.tencent.com（本地开发用，快），
      #   而 **yarn.lock 里 780 条依赖的 resolved 字段全部写死了该镜像地址**。
      #   yarn 1 下载时优先照 resolved 走（--frozen-lockfile 下更是强制），
      #   于是海外 runner 要横跨到腾讯云拉 780 个包，慢且易超时（实测首次失败耗时 3m53s）。
      #
      #   修法：在 runner 上把 lockfile 的镜像地址**临时改写**回官方源再装。
      #   - 只改工作副本、不提交回仓库 → 本地开发照旧走腾讯源，速度不受影响
      #   - 版本号与 integrity 哈希都不动，仅换下载主机，装的还是同一批包
      - name: 安装依赖（腾讯源改写为官方源）
        shell: bash
        run: |
          set -e
          # 1) 仓库自带的 .npmrc 会把 registry 拉回腾讯源，先移除
          rm -f .npmrc

          # 2) lockfile 里所有 resolved 从腾讯镜像改回官方 registry。
          #    改完打印前后数量便于在日志里核对（预期：780 → 0）。
          before=$(grep -c 'mirrors.cloud.tencent.com' yarn.lock || true)
          sed -i 's#https://mirrors\.cloud\.tencent\.com/npm/#https://registry.npmjs.org/#g' yarn.lock
          after=$(grep -c 'mirrors.cloud.tencent.com' yarn.lock || true)
          echo "lockfile 腾讯源数量：改前 $before → 改后 $after（应为 0）"

          # 3) 官方源安装。此时 lockfile 已指向官方源，--frozen-lockfile 既能保证
          #    「装的版本与本地一致」，又不会再去碰腾讯源。
          yarn install --frozen-lockfile --network-timeout 600000

      # ⚠️ 预置 NSIS 工具链（否则构建会随机失败，见文件末尾「已知踩过的坑」）
      #
      # electron-builder 打包 Windows 安装包时，需要从
      #   github.com/electron-userland/electron-builder-binaries/releases
      # 下载 nsis-3.0.4.1.7z 与 nsis-resources-3.4.1.7z 两个归档。
      # 它的下载器（got）**不做重试**：一次连接中断就整体
      #   ⨯ The server aborted pending request（ReadError）
      # 直接让 yarn dist 失败。实测该链路确实会抖 —— 同一时刻请求这两个文件，
      # 一个返回 206、另一个返回连接失败（2026-09-22 复现）。
      #
      # 修法：自己带重试把归档下好，放进 electron-builder 的缓存目录，让它直接命中缓存、
      # 不再发起那次不稳定的下载。缓存目录名 = 该文件的 sha256，目录下放原始文件即可
      # （本机实测确认：downloads/<sha256>/<原名>）。校验值取自
      # app-builder-lib/out/toolsets/windows.js 里 getBinFromUrl 的第三个参数——
      # 写死在这里是有意的：一旦上游改版本，下面的 sha256 校验会失败并明确报错，
      # 比"静默用错工具链"安全。
      - name: 预置 NSIS 工具链（带重试）
        shell: bash
        run: |
          set -e
          # ⚠️ 必须与下面「构建」步骤的 ELECTRON_BUILDER_CACHE 指向同一个目录，
          #   否则预置的归档不会被 electron-builder 命中，等于白下。
          CACHE_ROOT="${{ runner.temp }}/eb-cache/downloads"
          BASE="https://github.com/electron-userland/electron-builder-binaries/releases/download"

          fetch() {  # $1=<release 名>/<文件名>  $2=sha256
            local rel="$1" sha="$2" name
            name="$(basename "$rel")"
            local dir="$CACHE_ROOT/$sha"
            # 已存在且校验通过就直接用（重跑时省一次下载）
            if [ -f "$dir/$name" ] && (cd "$dir" && echo "$sha  $name" | sha256sum -c -) >/dev/null 2>&1; then
              echo "✓ 已缓存且校验通过：$name"
              return 0
            fi
            mkdir -p "$dir"
            # ⚠️ 先 cd 进目标目录再用**相对路径**写文件：
            #   Git Bash 下把 /d/... 这类长路径交给 Windows 版 curl 走 -o 时会被转换错，
            #   报「Failed to open the file ... No such file or directory」（本地实测踩到）。
            #   目录名是 64 位 sha256，整串路径很容易超限，相对路径最稳。
            (cd "$dir" && \
              echo "↓ 下载 $name" && \
              curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
                   --connect-timeout 30 --max-time 600 \
                   -o "$name" "$BASE/$rel" && \
              echo "$sha  $name" | sha256sum -c -)
          }

          fetch "nsis-3.0.4.1/nsis-3.0.4.1.7z" \
                "9877df902530f96357d13a7a31ae2b9df67f48b11ffc9a1700a7c961574ec5fa"
          fetch "nsis-resources-3.4.1/nsis-resources-3.4.1.7z" \
                "593a9a92ef958321293ac6a2ee61e64bf1bd543142a5bd6b3d310709cc924103"

          echo "预置完成，缓存内容："
          ls -lR "$CACHE_ROOT"

      # dist 里已经串了 gen-update-meta → electron-vite build → electron-builder --win
      - name: 构建 Windows 安装包
        run: yarn dist
        env:
          # electron 二进制体积大（~100MB），走官方 GitHub Release 直连；
          # 若 CI 上偶发超时，可改为国内镜像（不在仓库里写死，避免影响本地开发）
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache

      # ⚠️ 打包后的产物名校验，**不能省**：
      #   上传步骤不会因为"文件不存在"就报错（fail_on_unmatched_files 需谨慎开启，
      #   否则 mac 产物缺失时 Windows 也会连带失败），一旦 electron-builder.yml 的
      #   artifactName 没生效——比如产物还叫「青鸟 Setup 1.0.0.exe」这种带版本号的默认名，
      #   上传就会**静默跳过**，Release 建出来却是空的，且日志里看不出异常。
      #   所以这里主动断言文件名，不对就立刻红掉并打出实际内容，便于一眼定位。
      - name: 校验安装包名（必须是 青鸟-Setup.exe）
        shell: bash
        run: |
          echo "dist 实际内容："
          ls -l dist
          if [ ! -f "dist/青鸟-Setup.exe" ]; then
            echo "::error::未找到 dist/青鸟-Setup.exe——检查 electron-builder.yml 的 artifactName 是否生效"
            exit 1
          fi
          echo "✓ 安装包名正确"

      # 上传安装包（files 用固定名：GitHub 会把中文名转义，写死最稳）。
      # 前面已断言过文件存在，故这里改为「匹配不到就失败」——静默成功比失败更难排查。
      - name: 上传安装包到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/青鸟-Setup.exe
            dist/latest.yml
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          # 没有手写说明时自动用提交信息生成；有 Release 说明就先建好 Release 再跑本流程
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 构建日志里留一份产物清单：发版后想确认"到底传上去了什么"时不用翻 UI
      - name: 列出产物
        shell: bash
        run: ls -l dist
