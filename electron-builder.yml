# 打包说明
# - win: NSIS 安装包（主开发平台）
# - mac: dmg / zip（Mac 支持；个人自用可 unset CSC_IDENTITY_AUTO_DISCOVERY 跳过签名）
# - extraResources 把 OpenCode 内核二进制拷进 resources/bin（主进程打包态从该处读取）
appId: com.qingniao.desktop
productName: 青鸟
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/image/icon.png
  # 主进程运行时要用的第三方包：二维码编码器（移动端面板把 {平台}/ide/device/{token} 画成码）。
  # files 一旦自定义就不再带默认的 node_modules，用到的必须显式列出来。
  - node_modules/qrcode-generator/**
extraResources:
  # OpenCode 内核原生二进制（主进程打包态从 resources/bin 读取）
  - from: node_modules/opencode-ai/bin
    to: bin
  # 应用图标：主进程 createWindow / createTray 都要读它，所以平铺到 resources 根
  - from: resources/image/icon.png
    to: icon.png
  # 内置技能（主进程启动时同步到 ~/.qingniaoai/opencode/skills）
  - from: resources/builtin-skills
    to: builtin-skills
  # 面板浏览器 MCP 脚本（AI 操控右侧面板 webview 的工具端）
  - from: resources/mcp/panel-mcp.mjs
    to: panel-mcp.mjs
  # 桌面辅助 MCP 脚本（app_running 查进程，防桌面控制重复启动应用实例）
  - from: resources/mcp/desktop-mcp.mjs
    to: desktop-mcp.mjs
  # 媒体生成 MCP 脚本（generate_image / create_video / check_video，让对话模型也能生图生视频）
  - from: resources/mcp/media-mcp.mjs
    to: media-mcp.mjs
  # 图片理解 MCP 脚本（describe_image，非视觉模型发图时由视觉模型代看）
  - from: resources/mcp/vision-mcp.mjs
    to: vision-mcp.mjs
  # 电脑控制视觉叠加 MCP 脚本（代理 computer-use-mcp，把截图读成文字给收不了图的模型）
  - from: resources/mcp/screen-mcp.mjs
    to: screen-mcp.mjs
  # UIA 桌面 MCP 脚本（读 Windows 无障碍树，按元素名点击/输入——桌面控制的首选通道，不吃图片输入）
  - from: resources/mcp/uia-mcp.mjs
    to: uia-mcp.mjs
  # UIA 常驻宿主（PowerShell + UI Automation）。**必须与 uia-mcp.mjs 平铺在同一目录**：
  # 薄壳靠 import.meta.url 从自己所在目录找它，放子目录就找不到
  - from: resources/mcp/uia-host.ps1
    to: uia-host.ps1
  # 原生键盘输入层（SendInput 组合键 + 「不往青鸟自己窗口输入」守卫）。
  # **必须与 uia-mcp.mjs / screen-mcp.mjs 平铺在同一目录**：前者 dot-source 它，后者按
  # 相对路径 spawn 它；而且 screen-mcp 内的 win-input.ps1 走同一份实现，放子目录两边都找不到
  - from: resources/mcp/win-input.ps1
    to: win-input.ps1
  # 语音合成 MCP 脚本（generate_speech，把文字配成音频）
  - from: resources/mcp/tts-mcp.mjs
    to: tts-mcp.mjs
  # 音乐生成 MCP 脚本（generate_music / check_music，异步提交 + 轮询）
  - from: resources/mcp/music-mcp.mjs
    to: music-mcp.mjs
  # 语音识别 MCP 脚本（transcribe_audio，音频转文字）
  - from: resources/mcp/asr-mcp.mjs
    to: asr-mcp.mjs
  # 「调用其他模型」授权闸门客户端。**必须与上面 6 个会调模型的 MCP 平铺在同一目录**：
  # 它们靠 import './gate.mjs' 就近加载，放子目录就 import 不到，MCP 直接起不来
  - from: resources/mcp/gate.mjs
    to: gate.mjs
# 把 extraResources 的 bin 从 asar 拆出（asar 内无法执行原生二进制；Windows 同样需要）
asarUnpack:
  - "**/resources/bin/**"
win:
  icon: resources/image/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
mac:
  icon: resources/image/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  # 个人自用 / 无 Apple Developer 账号时，可在调用 dist:mac 脚本前导出：
  #   export CSC_IDENTITY_AUTO_DISCOVERY=false
  # 否则 electron-builder 会要求签名（公证另需 Apple 公证服务）。
dmg:
  sign: false
