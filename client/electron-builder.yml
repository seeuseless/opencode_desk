# 打包说明
# - win: NSIS 安装包（主开发平台）
# - mac: dmg / zip（Mac 支持；个人自用可 unset CSC_IDENTITY_AUTO_DISCOVERY 跳过签名）
# - linux: AppImage（glibc 发行版；Alpine/musl 不支持）
# - extraResources 把 OpenCode 内核二进制拷进 resources/bin（主进程打包态从该处读取）
appId: com.qingniao.desktop
productName: 青鸟
# 版本号唯一事实来源就是 package.json（发版时改它、并打同名 tag），**不要在这里重复声明**：
# ⚠️ 曾写过 `extraMetadata: { version: ${version} }` 想"重述一遍"，结果把这个占位符**原样**塞进了
#    app 的 package.json —— electron-builder 读到的 version 是字面量 "${version}"，
#    在 Windows 上写 exe 资源版本号时就炸了（2026-09-22 CI 实测）：
#      updating asar integrity executable resource  executablePath=dist\win-unpacked\青鸟.exe
#      ⨯ Invalid major number in: ${version}
#         at AppInfo.getVersionInWeirdWindowsForm (app-builder-lib/src/appInfo.ts:93:13)
#    去掉后 electron-builder 会自己从 package.json 取 version，行为完全一致。
#    记住：extraMetadata 的值不做占位符展开，只有 artifactName 那类模板字段才展开。
#
# ⚠️ publish: null 是**必需**的，不是可选项（2026-09-22 CI 实测踩到，连续两次踩坑）：
#   本项目**不使用 electron-builder 的更新元数据**（app-update.yml）——
#   应用内更新读的是 resources/update.json + GitHub Releases 的
#   /releases/latest/download/QingNiao-Setup.exe 固定地址（见下方 artifactName 说明）。
#
#   不写 publish 会怎样：electron-builder 从 package.json 的 repository 字段
#   （github.com/seeuseless/opencode_desk）**推断出 provider=github**，
#   然后在写 app-update.yml 那步构造 GitHubPublisher，其构造函数第一件事就是取 token，
#   取不到即抛：
#     ⨯ GitHub Personal Access Token is not set, neither programmatically, nor using env "GH_TOKEN"
#   注意报错发生在签名 + blockmap **之后**，看着像"发布失败"，实际是生成更新元数据时炸的。
#   而且 `--publish never` 拦不住它 —— PublishManager 源码注释明说
#   "file should be generated regardless of publish state"（无条件生成）。
#
#   写成 `publish: generic` 也不行（试过）：generic 分支会被 getResolvedPublishConfig
#   强制校验 url，缺了就换一个错继续抛：
#     ⨯ Please specify "url" for "generic" update server
#
#   只有 `publish: null` 才真正短路（PublishManager.getPublishConfigs 三处都有
#   `if (publishers === null) return null`，语义就是注释写的 "explicitly set to null - do not publish"）
#   → 上游拿到 null 后 getAppUpdatePublishConfiguration 直接 return null，
#     既不推断 provider、也不建 publisher、也不生成 app-update.yml，干净。
#   将来若改用 electron-updater，把这里换回 { provider: github, ... } 即可。
publish: null
directories:
  output: dist
  buildResources: resources
# 安装包文件名**写死不含版本号**，这是"应用内检查更新"能自动找到下载地址的前提：
# 地址规则固定为 https://github.com/{repo}/releases/latest/download/QingNiao-Setup.exe，
# 不用先查 GitHub API（国内对 api.github.com 常不通）就能直接下最新版。
# 因此**每次发版都必须覆盖上传同名附件**，历史版本靠 git tag 与 Release 说明追溯。
#
# ⚠️ 文件名前缀写死英文 `QingNiao`，**不要改回 ${productName}**（那会产出「青鸟-Setup.exe」）：
#   GitHub 的 `releases/latest/download/<名>` 直链、以及上传附件后的 asset 名称对非 ASCII
#   字符要转义，中文名会让下载链接/文件名在各端表现不稳（转义、显示乱码、个别环境直接拿不到）。
#   注意这只是**产物文件名**：应用本身仍叫「青鸟」（productName 不变），桌面快捷方式、
#   开始菜单项、窗口标题都还是中文，改的只是发到 GitHub 的那个安装包。
#
# ⚠️ ${arch} 必须带（2026-09-25 加 Windows ARM64 后双架构出包）：多架构产物若同名会互相覆盖。
#   带上后 x64 产物叫 QingNiao-Setup-x64.exe、arm64 叫 QingNiao-Setup-arm64.exe。
#   「releases/latest/download/QingNiao-Setup.exe」固定直链（README 承诺的下载方式）由
#   release.yml 构建后把 x64 的包重命名成 QingNiao-Setup.exe 上传来维持——应用内更新
#   正常路径走 GitHub API 的 assets 按 arch 认领（updater.ts pickAsset），不依赖直链。
artifactName: QingNiao-Setup-${arch}.${ext}
files:
  - out/**
  - resources/image/icon.png
  #
  # 主进程运行时要用的第三方包：二维码编码器（移动端面板把 {平台}/ide/device/{token} 画成码）。
  # files 一旦自定义就不再带默认的 node_modules，用到的必须显式列出来。
  # ⚠️ 这是**唯一**需要白名单的运行时依赖 —— 因为它对应 package.json 里唯一一个 runtime
  #    import（electron/main/relay.ts）。别再把渲染层的包往 dependencies 里塞：
  #    electron-builder 会连带收集整棵传递依赖树进 app.asar，2026-09-22 实测因此白胖 74MB。
  #    判据很简单 —— 问自己"打包后的主进程代码里还能搜到这个名字吗？"
  #    renderer 的依赖全部被 Vite 打进 out/renderer 单文件了，源码侧搜不到，所以不用列。
  - node_modules/qrcode-generator/**
  # 第三方依赖快照（scripts/gen-deps.mjs 生成）：设置 → 依赖 页在打包态读不到 node_modules，靠它显示真实版本号与协议
  - resources/deps.json
  # 更新元数据（scripts/gen-update-meta.mjs 生成）：仓库坐标 + tag 前缀，主进程 updater.ts 读它，
  # 换仓库/换 tag 命名只改这一个文件，不用动源码
  - resources/update.json
  #
  # ⚠️ 必须排除 opencode 平台包，否则安装包会凭空胖 500MB（2026-09-22 实测）：
  #   opencode-ai 用 optionalDependencies 声明了 12 个平台包
  #   （opencode-windows-x64 / -baseline、darwin-x64/arm64、linux-* 等），
  #   而每个平台包里的 opencode 二进制都是 **172MB**。
  #   electron-builder 有个"原生依赖自动解包"机制：扫描依赖时发现含原生可执行文件
  #   （.exe / .node）的包，就把它们**整包**解到 app.asar.unpacked/ 下。于是
  #   172MB 的二进制被打进去 **4 份**（asar 内、unpacked 内、以及两个平台包各一份），
  #   光重复就占 516MB —— 安装包从本可做到的 ~50MB 涨到 215MB。
  #
  #   这些平台包只是**安装期的原料**：opencode-ai 的 postinstall 从里面把对应平台的
  #   二进制拿走覆盖到自己的 bin/ 下，之后就没用了。运行期主进程读的是
  #   resources/bin/opencode.exe（见下方 extraResources），完全不碰这些包。
  #   所以排除是安全的 —— 但**前提是 extraResources 那一步确实拿对了文件**，
  #   这就是 scripts/check-kernel.mjs 存在的意义（它会在打包前确认 bin/ 下是真二进制）。
  - "!node_modules/opencode-ai/**"
  - "!node_modules/opencode-*/**"
  - "!node_modules/opencode-windows-*/**"
  - "!node_modules/opencode-darwin-*/**"
  - "!node_modules/opencode-linux-*/**"
  #
  # 兜底排除：下面这些包**现在已不是 dependencies**（2026-09-22 全部移到 devDependencies），
  # 正常不会被打进来；留着是防止将来有人手滑把它们塞回 dependencies 又把 asar 撑胖。
  # 原理同上：含原生可执行文件（.exe/.node）的包会被"自动解包"整包搬进去。
  #   @img/sharp-*（28MB，sharp 只在一次性脚本 scripts/gen-icon.mjs 里用）
  #   clipboardy（1MB，其 fallback .exe 触发了解包）
  #   @nut-tree-fork（1.5MB，computer-use-mcp 的依赖；MCP 是独立 node 进程）
  - "!node_modules/@img/**"
  - "!node_modules/clipboardy/**"
  - "!node_modules/@nut-tree-fork/**"
extraResources:
  # OpenCode 内核原生二进制（主进程打包态从 resources/bin 读取）
  - from: node_modules/opencode-ai/bin
    to: bin
  # 应用图标：主进程 createWindow / createTray 都要读它，所以平铺到 resources 根
  - from: resources/image/icon.png
    to: icon.png
  # 内置技能（主进程启动时同步到 ~/.qingniaoai/opencode/skills）
  - from: resources/builtin-skills
    to: builtin-skills
  # 面板浏览器 MCP 脚本（AI 操控右侧面板 webview 的工具端）
  - from: resources/mcp/panel-mcp.mjs
    to: panel-mcp.mjs
  # 媒体生成 MCP 脚本（generate_image / create_video / check_video，让对话模型也能生图生视频）
  - from: resources/mcp/media-mcp.mjs
    to: media-mcp.mjs
  # 图片理解 MCP 脚本（describe_image，非视觉模型发图时由视觉模型代看）
  - from: resources/mcp/vision-mcp.mjs
    to: vision-mcp.mjs
  # 语音合成 MCP 脚本（generate_speech，把文字配成音频）
  - from: resources/mcp/tts-mcp.mjs
    to: tts-mcp.mjs
  # 音乐生成 MCP 脚本（generate_music / check_music，异步提交 + 轮询）
  - from: resources/mcp/music-mcp.mjs
    to: music-mcp.mjs
  # 语音识别 MCP 脚本（transcribe_audio，音频转文字）
  - from: resources/mcp/asr-mcp.mjs
    to: asr-mcp.mjs
  # 「调用其他模型」授权闸门客户端。**必须与上面 6 个会调模型的 MCP 平铺在同一目录**：
  # 它们靠 import './gate.mjs' 就近加载，放子目录就 import 不到，MCP 直接起不来
  - from: resources/mcp/gate.mjs
    to: gate.mjs
  # 办公文件 MCP 脚本（office_extract / write_docx / write_xlsx / write_pptx / pdf_utils）
  - from: resources/mcp/office-mcp.mjs
    to: office-mcp.mjs
  # 全局记忆 MCP 脚本（memory_read / memory_append：AI 在对话里读写「设置 → 记忆」）
  - from: resources/mcp/memory-mcp.mjs
    to: memory-mcp.mjs
  # 数据处理 MCP 脚本（json_query / regex_find：JSON 接口一步取值、正则批量提取）
  - from: resources/mcp/data-mcp.mjs
    to: data-mcp.mjs
  # 邮件 MCP 脚本（mail_* 收发查 Agent Mail；依赖的 agently-cli 包在下面的 node_modules 拷贝里）
  - from: resources/mcp/mail-mcp.mjs
    to: mail-mcp.mjs
  # 办公 MCP 的依赖包：与脚本平铺到 resources/node_modules，脚本就近 import（xlsx/docx/pptxgenjs/
  # pdfjs-dist 等，见 office-mcp.mjs 头部 workerSrc 注释）；dev 态则从 resources/mcp/node_modules 解析
  - from: resources/mcp/node_modules
    to: node_modules
# 把 extraResources 的 bin 从 asar 拆出（asar 内无法执行原生二进制；Windows 同样需要）
asarUnpack:
  - "**/resources/bin/**"
# 双架构支持（mac arm64+x64、Windows x64+arm64）：内核二进制不会随 electron-builder
# 的 arch 自动切换（它只管 Electron 本体，extraResources 里我们自己拷的 opencode 内核
# 是 postinstall 按「构建机器」架构放的），交叉架构出包前由这个钩子把内核换成目标架构
# （见脚本头注释）。本机构架构建时钩子按 process.arch 短路，行为与以前完全一致。
beforePack: scripts/electron-before-pack.cjs
win:
  icon: resources/image/icon.ico
  # target 不写 arch：默认只出构建机架构。CI 上用 `--x64 --arm64` 两个 flag 一次出
  # 双架构包（见 release.yml）；本地 dist 不带 flag，仍只出本机架构。
  # 交叉架构（x64 runner 打 arm64）的内核替换由顶层 beforePack 钩子处理。
  target:
    - nsis
  # 带 ${arch}：双架构产物不互相覆盖（x64 → QingNiao-Setup-x64.exe，arm64 → -arm64）。
  # 固定名 QingNiao-Setup.exe 由 release.yml 把 x64 产物重命名后上传，维持更新直链。
  artifactName: QingNiao-Setup-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
mac:
  icon: resources/image/icon.icns
  # target 不写 arch：默认只出构建机架构。CI 上用 `--arm64 --x64` 两个 flag 一次出
  # 双架构包（见 release.yml）；本地 dist:mac 不带 flag，仍只出本机架构。
  # 交叉架构的内核替换由顶层 beforePack 钩子处理（见上方说明）。
  # 只出 dmg 不出 zip：zip 是 electron-updater 做 mac 自动更新的格式，本项目不用它
  # （更新走 Release 元数据 + dmg），zip 纯属占 Release 空间（2026-09-25 删）。
  target:
    - dmg
  category: public.app-category.productivity
  # mac 上多架构产物同名会互相覆盖，故单独带 arch（与主进程 updater.ts 的 MAC_DMG_NAME 对应）
  artifactName: QingNiao-Setup-${arch}.${ext}
  # 个人自用 / 无 Apple Developer 账号时，可在调用 dist:mac 脚本前导出：
  #   export CSC_IDENTITY_AUTO_DISCOVERY=false
  # 否则 electron-builder 会要求签名（公证另需 Apple 公证服务）。
dmg:
  sign: false
# Linux（2026-10-08 加）：出 AppImage + deb 双格式。
# - AppImage：免安装、单文件、任意 glibc 发行版都能跑，手动替换即可更新（updater.ts
#   非 Windows 分支「下载完交还用户手动替换」，AppImage 覆盖旧文件 + chmod +x 即可）。
# - deb：Debian / Ubuntu / 衍生系用户习惯的包，apt 安装、自带菜单项。架构段 x64 → amd64
#   （electron-builder 对 deb 的 getArtifactArchName 映射，见 release.yml 注释），
#   与 AppImage 的 x86_64 不同——上传步骤与 updater.ts 都按各自命名认领，别写岔。
# 不出 snap：要审核、节奏不可控，性价比低。
# ⚠️ 只覆盖 **glibc** 发行版（Debian / Ubuntu / Fedora / Arch…）。Alpine 是 musl libc，
#   跑不了这个包；要支持得另出一套 -musl 内核的包，产物与 CI 时间都翻倍，暂不做。
linux:
  icon: resources/image/icon.png
  target:
    - AppImage
    - deb
  # deb 必须能确定 maintainer（FpmTarget 用它写 DEBIAN/control 的 Maintainer 字段）。
  # 项目 package.json 的 author 只是纯字符串「qingniao」、无邮箱，eb 会报
  # 「Please specify author 'email' ... Linux .deb package maintainer」而中断——
  # 显式写 maintainer 即可短路该推导，且与 author 解耦（author 不必因此塞邮箱）。
  maintainer: QingNiao Dev <seeuseless@users.noreply.github.com>
  # syncDesktopName: 把上面 package.json 的 desktopName 写进 .desktop 的 Name/WM_CLASS，
  # 让桌面环境能把运行中的窗口正确关联到本应用（否则报 desktopName 缺失的 warning，
  # 且窗口与启动器图标可能关不上关联）。
  syncDesktopName: true
  category: Utility
  synopsis: 开源工作助手
  description: 青鸟 QingNiao —— 开源工作助手，Electron 桌面壳 + OpenCode agent 内核。
  # 带 ${arch}：双格式 × 双架构同挂一个 Release，名字必须区分开。
  # - AppImage：QingNiao-Setup-x86_64.AppImage / QingNiao-Setup-arm64.AppImage
  #   （与 updater.ts 的 LINUX_APPIMAGE_NAME 认领规则对应，改一处必须同步另一处）
  # - deb：QingNiao-Setup-amd64.deb / QingNiao-Setup-arm64.deb
  #   （deb 上 x64 → amd64，AppImage 上 x64 → x86_64，两套名字别写岔）
  # 不像 Windows 需要重命名回固定名——Linux 走 GitHub API assets 按 arch 认领，
  # 不依赖 releases/latest/download 直链。
  artifactName: QingNiao-Setup-${arch}.${ext}
